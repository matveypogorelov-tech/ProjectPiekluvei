{% extends "base.html" %}
{% block content %}
    <h2 style="color: #2c9062;">Pievienot jaunu medikamentu</h2>
    <form method="POST" action="/admin" style="background: #f8f9fa; padding: 15px; border-radius: 5px; border: 1px solid #ddd; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <input type="text" name="nosaukums" placeholder="Nosaukums" required style="padding: 8px;">
        <input type="number" step="0.01" name="cena" placeholder="Cena (€)" required style="padding: 8px; width: 100px;">
        <input type="text" name="apraksts" placeholder="Īss apraksts" style="padding: 8px; flex: 1;">
        <select name="kategorija_id" style="padding: 8px;">
            {% for kat in global_kategorijas %}
                <option value="{{ kat.id }}">{{ kat.nosaukums }}</option>
            {% endfor %}
        </select>
        <button type="submit" style="padding: 9px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Pievienot</button>
    </form>

    <h2 style="margin-top: 30px;">Esošais asortiments</h2>
    <table style="width: 100%; border-collapse: collapse;">
        <tr>
            <th style="padding: 10px; border-bottom: 2px solid #ddd; text-align: left;">ID</th>
            <th style="padding: 10px; border-bottom: 2px solid #ddd; text-align: left;">Nosaukums</th>
            <th style="padding: 10px; border-bottom: 2px solid #ddd; text-align: left;">Cena</th>
            <th style="padding: 10px; border-bottom: 2px solid #ddd; text-align: left;">Darbība</th>
        </tr>
        {% for med in medikamenti %}
        <tr>
            <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ med.id }}</td>
            <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ med.nosaukums }}</td>
            <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ "%.2f"|format(med.cena) }} €</td>
            <td style="padding: 10px; border-bottom: 1px solid #ddd;"><a href="/dzest/{{ med.id }}" style="color: white; background-color: #dc3545; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 14px;">Dzēst</a></td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
